name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: build-requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile source
        run: python -m compileall -q kcredits.py scripts tests

  release-safety:
    name: Public release safety
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out complete public history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Scan release files and history
        run: python scripts/release_scan.py --strict --history

      - name: Build wheel with pinned build dependency
        run: |
          python -m pip install --require-hashes -r build-requirements.txt
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .

      - name: Install and smoke-test wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          kcredits help
