name: Feature request
description: Suggest a privacy-preserving improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: This request contains no real session data or private paths.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem should kcredits solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include an example command and sanitized output if useful.
    validations:
      required: true

  - type: textarea
    id: boundary
    attributes:
      label: Security and privacy impact
      description: Would this add network access, new writes, subprocesses, or sensitive output?
    validations:
      required: true
